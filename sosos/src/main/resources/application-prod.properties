spring.config.activate.on-profile=prod

spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

spring.jmx.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://api.style-of-simplicity.com,https://style-of-simplicity.com,https://www.style-of-simplicity.com}

app.storage.type=${APP_STORAGE_TYPE:s3}
app.upload.base-dir=${APP_UPLOAD_BASE_DIR:uploads}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET}
app.storage.s3.region=${APP_STORAGE_S3_REGION:ap-northeast-2}
app.storage.s3.prefix=${APP_STORAGE_S3_PREFIX:sosos}
app.storage.s3.public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
app.storage.s3.path-style-access=${APP_STORAGE_S3_PATH_STYLE_ACCESS:false}

app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.max-input-length=${AI_MAX_INPUT_LENGTH:180}
app.ai.max-candidates=${AI_MAX_CANDIDATES:5}
app.ai.free-tier.remote-enabled=${AI_REMOTE_ENABLED:false}
app.ai.free-tier.cooldown-seconds=${AI_REMOTE_COOLDOWN_SECONDS:45}
app.ai.llm-explanation.enabled=${AI_LLM_EXPLANATION_ENABLED:true}
app.ai.llm-explanation.max-output-tokens=${AI_LLM_EXPLANATION_MAX_OUTPUT_TOKENS:180}

app.payment.toss.enabled=${TOSS_ENABLED:false}
app.payment.toss.secret-key=${TOSS_SECRET_KEY:}
app.payment.toss.confirm-url=${TOSS_CONFIRM_URL:https://api.tosspayments.com/v1/payments/confirm}
